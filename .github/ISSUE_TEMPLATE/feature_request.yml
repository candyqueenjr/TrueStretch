name: 💡 Feature request
description: An idea for TrueStretch — a new game, a setting, anything.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: What is it about?
      options:
        - A new game
        - Stretching / resolutions
        - The app (look, settings, tray)
        - Performance / FPS
        - Something else
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like TrueStretch to do, and why would it help you?
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Links, screenshots or videos that show what you mean.
    validations:
      required: false
